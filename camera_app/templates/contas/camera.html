<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detecção de Sentimentos</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .card-camera {
            background-color: #fff;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 680px; /* mais largo para comportar o vídeo */
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            color: #333;
        }

        .video-container {
            position: relative;
            margin: 0 auto;
        }

        #video {
            width: 100%;
            border: 2px solid #ccc;
            border-radius: 10px;
            background: #000;
        }

        #overlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            display: none;
        }

        #status {
            margin-top: 15px;
            font-size: 17px;
            font-weight: 600;
            color: #28a745;
        }

        #controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        #controls input {
            width: 90px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        #controls button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        #controls button:hover {
            background: #0056b3;
        }

        .btn-voltar {
        display: block;
        width: 100%;
        margin-top: 40px;     /* mais espaço acima */
        margin-bottom: 50px;  /* espaço para não colidir com os logos */
        background: #dc3545;
        color: white;
        text-align: center;
        padding: 14px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.3s;
    }

        .btn-voltar:hover {
            background: #b02a37;
        }

        /* Logos iguais ao login */
        .logos-container {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .logos-container img {
            width: 48px;
            height: auto;
            opacity: 0.9;
            transition: 0.3s;
        }

        .logos-container img:hover {
            opacity: 1;
        }

        @media (max-width: 480px) {
            .card-camera {
                padding: 25px 18px;
            }

            #controls input {
                width: 70px;
            }
        }
    </style>
</head>

<body>

    <div class="card-camera">
        <h2>Detecção de Sentimentos</h2>

        <div class="video-container" id="video-container" data-intervalo="{{ intervalo|default_if_none:30000 }}">
            <video id="video" autoplay playsinline></video>
            <div id="overlay">Aguardando...</div>
        </div>

        <p id="status">Iniciando câmera...</p>

        <div id="controls">
            <span style="font-size:16px; font-weight:600;">Intervalo (s):</span>
            <input id="intervalo-input" type="number" min="5" step="1" value="">
            <button id="btn-set-intervalo">Aplicar</button>
        </div>

        <a href="{% url 'home' %}" class="btn-voltar">Voltar</a>
    </div>

    <div class="logos-container">
        <img src="https://static.wixstatic.com/media/004bc3_29dab9f106354470b5a06deb88eca22e~mv2.png">
        <img src="https://images.seeklogo.com/logo-png/49/2/universidade-federal-fluminense-logo-png_seeklogo-492878.png">
    </div>

    <script>
        (function() {
            const MIN_INTERVAL_S = 5;
            const overlay = document.getElementById("overlay");
            const video = document.getElementById("video");
            const statusEl = document.getElementById("status");
            const container = document.getElementById("video-container");
            const intervaloInput = document.getElementById("intervalo-input");

            let intervaloMs = 30000;
            const parsed = Number(container.dataset.intervalo);
            if (Number.isFinite(parsed) && parsed > 0) intervaloMs = parsed;
            intervaloInput.value = Math.round(intervaloMs / 1000);

            function getCookie(name) {
                const value = `; ${document.cookie}`;
                const parts = value.split(`; ${name}=`);
                if (parts.length === 2) return parts.pop().split(";").shift();
                return "";
            }

            function setStatus(text, ok) {
                statusEl.innerText = text;
                statusEl.style.color = ok ? "#28a745" : "#d00";
            }

            function showOverlay(text) {
                overlay.style.display = "block";
                overlay.innerText = text;
            }

            function horaAtual() {
                return new Date().toLocaleTimeString();
            }

            // Envia uma requisição POST e devolve {status, data}; data é null se a
            // resposta não for JSON (por exemplo, uma página HTML de erro).
            async function postJson(url, body, extraHeaders) {
                const resp = await fetch(url, {
                    method: "POST",
                    body: body,
                    credentials: "same-origin",
                    headers: Object.assign({ "X-CSRFToken": getCookie("csrftoken") }, extraHeaders || {}),
                });
                const type = resp.headers.get("Content-Type") || "";
                const data = type.includes("application/json") ? await resp.json() : null;
                return { status: resp.status, data: data };
            }

            document.getElementById("btn-set-intervalo").addEventListener("click", async () => {
                const s = Number(intervaloInput.value);
                if (!Number.isFinite(s) || s < MIN_INTERVAL_S) {
                    return alert(`Insira um número inteiro de pelo menos ${MIN_INTERVAL_S} segundos.`);
                }
                try {
                    const r = await postJson(
                        "/salvar_intervalo/",
                        new URLSearchParams({ segundos: Math.round(s) }),
                        { "Content-Type": "application/x-www-form-urlencoded" }
                    );
                    if (r.status === 200) {
                        intervaloMs = Math.round(s) * 1000;
                        alert("Intervalo salvo!");
                    } else {
                        alert("Erro: " + ((r.data && r.data.erro) || "não foi possível salvar"));
                    }
                } catch (e) {
                    alert("Erro de conexão ao salvar o intervalo.");
                }
            });

            const canvas = document.createElement("canvas");

            function capturarFrame() {
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
                return new Promise(resolve => canvas.toBlob(b => resolve(b), "image/jpeg"));
            }

            const ALERT_TEXT = {
                sent: "Alerta enviado por e-mail.",
                cooldown: "Alerta já enviado recentemente; novo e-mail suprimido.",
                no_email: "ATENÇÃO: usuário sem e-mail cadastrado. Alerta NÃO enviado.",
                failed: "ATENÇÃO: falha ao enviar o e-mail de alerta.",
            };

            // Processa um quadro. Devolve false se o monitoramento deve parar.
            async function processarUmQuadro() {
                let r;
                try {
                    const formData = new FormData();
                    formData.append("frame", await capturarFrame(), "frame.jpg");
                    r = await postJson("/process_frame/", formData);
                } catch (e) {
                    setStatus(`Sem conexão com o servidor (${horaAtual()}). Tentando novamente...`, false);
                    return true;
                }

                if (r.status === 401 || r.status === 403) {
                    showOverlay("Monitoramento interrompido");
                    setStatus("Sessão expirada. Faça login novamente para retomar o monitoramento.", false);
                    return false;
                }
                const data = r.data;
                if (r.status === 200 && data && data.detected === false) {
                    showOverlay("Nenhuma pessoa detectada");
                    setStatus(`Monitorando. Última análise: ${horaAtual()}`, true);
                } else if (r.status === 200 && data && data.detected) {
                    showOverlay("Expressão detectada: " + data.sentiment);
                    let msg = `Monitorando. Última análise: ${horaAtual()}`;
                    let ok = true;
                    if (data.alert) {
                        msg += " — " + (ALERT_TEXT[data.alert] || data.alert);
                        ok = data.alert === "sent" || data.alert === "cooldown";
                    }
                    setStatus(msg, ok);
                } else if (data && data.inconclusive) {
                    showOverlay("Resultado inconclusivo neste quadro");
                    setStatus(`Monitorando. Última análise inconclusiva: ${horaAtual()}`, false);
                } else {
                    showOverlay("Erro ao analisar o quadro");
                    setStatus(`Erro no servidor (${horaAtual()}): ${(data && data.error) || r.status}. Tentando novamente...`, false);
                }
                return true;
            }

            // Controle do laço: cada início cria uma "geração" nova; um laço antigo
            // que ainda esteja dormindo encerra sozinho ao acordar.
            let running = false;
            let geracao = 0;

            function startLoop() {
                if (running) return;
                running = true;
                const minhaGeracao = ++geracao;
                setStatus("Monitoramento iniciado.", true);
                (async function loop() {
                    while (running && minhaGeracao === geracao) {
                        const continuar = await processarUmQuadro();
                        if (!continuar) { stopLoop(); break; }
                        await new Promise(r => setTimeout(r, intervaloMs));
                    }
                })();
                btnStop.textContent = "Parar captura";
            }

            function stopLoop() {
                running = false;
                geracao++;
                btnStop.textContent = "Iniciar captura";
            }

            const btnStop = document.createElement("button");
            btnStop.textContent = "Parar captura";
            btnStop.style.marginLeft = "12px";
            btnStop.onclick = () => {
                if (running) {
                    stopLoop();
                    setStatus("Monitoramento pausado.", false);
                    showOverlay("Captura parada");
                } else {
                    startLoop();
                }
            };
            document.getElementById("controls").appendChild(btnStop);

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    setStatus("Câmera ativada!", true);
                    video.addEventListener("loadedmetadata", () => startLoop());
                })
                .catch(() => {
                    setStatus("Erro ao acessar a câmera.", false);
                });
        })();
    </script>

</body>
</html>
