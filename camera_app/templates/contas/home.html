{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>
        body {
            margin: 0;
            background-color: #f0f2f5;
            font-family: "Segoe UI", Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .home-container {
            background-color: #fff;
            padding: 35px 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #333;
        }

        h1 span {
            color: #007bff;
        }

        p {
            font-size: 17px;
            color: #555;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 14px;
        }

        .btn-camera {
            background-color: #007bff;
        }
        .btn-camera:hover {
            background-color: #0056b3;
        }

        .btn-logout {
            background-color: #dc3545;
        }
        .btn-logout:hover {
            background-color: #b32433;
        }

        .logos-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }

        .logos-container img {
            width: 48px;
            height: auto;
            opacity: 0.9;
        }

        @media (max-width: 400px) {
            .home-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 22px;
            }

            p {
                font-size: 16px;
            }

            .btn {
                font-size: 17px;
                padding: 14px;
            }

            .logos-container img {
                width: 42px;
            }
        }
    </style>
</head>

<body>

    <div class="home-container">
        <h1>Bem-vindo, <span>{{ user.username }}</span>!</h1>
        <p>Você está logado no sistema.</p>

        <a href="{% url 'camera' %}" class="btn btn-camera">Abrir Câmera</a>
        <a href="{% url 'logout' %}" class="btn btn-logout">Sair</a>
    </div>

    <div class="logos-container">
        <img src="https://static.wixstatic.com/media/004bc3_29dab9f106354470b5a06deb88eca22e~mv2.png" alt="Universidade 1">
        <img src="https://images.seeklogo.com/logo-png/49/2/universidade-federal-fluminense-logo-png_seeklogo-492878.png" alt="Universidade 2">
    </div>

</body>
</html>
