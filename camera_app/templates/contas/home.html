{% load static %}
<div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e5e5e5; font-family: Arial, sans-serif; position: relative;">
    <div style="background-color: #f2f2f2; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center;">
        <h1 style="color: #333;">Bem-vindo, <span style="color: #007bff;">{{ user.username }}</span>!</h1>
        <p style="color: #555;">Você está logado no sistema.</p>

        <!-- Botão para abrir a câmera -->
        <a href="{% url 'camera' %}" 
           style="display: inline-block; margin-top: 20px; padding: 10px 25px; 
                  background-color: #007bff; color: white; text-decoration: none; 
                  border-radius: 6px; transition: 0.3s; margin-right: 10px;">
            Abrir Câmera
        </a>

        <!-- Botão de logout -->
        <a href="{% url 'logout' %}" 
           style="display: inline-block; margin-top: 20px; padding: 10px 25px; 
                  background-color: #dc3545; color: white; text-decoration: none; 
                  border-radius: 6px; transition: 0.3s;">
            Sair
        </a>
    </div>

    <!-- Logos no canto inferior esquerdo -->
    <div style="position: absolute; bottom: 20px; left: 20px; display: flex; gap: 12px; align-items: center;">
        <img src="https://static.wixstatic.com/media/004bc3_29dab9f106354470b5a06deb88eca22e~mv2.png"
             alt="Universidade 1"
             style="height: 45px; width: auto; opacity: 0.9;">
        <img src="https://images.seeklogo.com/logo-png/49/2/universidade-federal-fluminense-logo-png_seeklogo-492878.png"
             alt="Universidade 2"
             style="height: 45px; width: auto; opacity: 0.9;">
    </div>
</div>
