<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Câmera</title>
  <style>
    body {
      background: #111;
      color: #fff;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    .video-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }
    #video {
      width: 640px;
      height: auto;
      border: 2px solid #444;
      border-radius: 8px;
      display: block;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 16px;
      display: none;
      pointer-events: none;
    }
    #status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #0f0;
    }

    /* controles opcionais */
    #controls {
      margin-top: 12px;
      color: #ddd;
    }
    #controls input { width: 80px; padding: 4px; margin-right: 8px; }
    #controls button { padding: 6px 10px; }
  </style>
</head>
<body>
  <h2>Detecção em tempo real</h2>

  <!-- Colocamos o intervalo no data-attribute do container para evitar injetar variável no JS -->
  <div class="video-container" id="video-container" data-intervalo="{{ intervalo|default_if_none:30000 }}">
    <video id="video" autoplay playsinline></video>
    <div id="overlay">Aguardando detecção...</div>
  </div>

  <p id="status">Iniciando câmera...</p>

  <!-- controles opcionais: usuário muda intervalo localmente (em segundos) -->
  <div id="controls">
    Intervalo (s):
    <input id="intervalo-input" type="number" min="5" step="1" value="">
    <button id="btn-set-intervalo">Aplicar</button>
    <small style="display:block;margin-top:6px;color:#999">
    </small>
  </div>

  <script>
    (function() {
      const overlay = document.getElementById("overlay");
      const video = document.getElementById("video");
      const statusEl = document.getElementById("status");
      const container = document.getElementById("video-container");

      // lê o valor do atributo data-intervalo (em ms) com fallback
      let intervaloMs = 30000;
      try {
        const raw = container.dataset.intervalo;
        const parsed = Number(raw);
        if (!Number.isFinite(parsed) || parsed <= 0) {
          console.warn("Intervalo do Django inválido, usando 30000 ms");
        } else {
          intervaloMs = parsed;
        }
      } catch (e) {
        console.warn("Erro ao ler intervalo do DOM, usando 30000 ms", e);
      }
      console.log("⏱ Intervalo inicial (ms):", intervaloMs);

      // preenche input opcional (em segundos)
      const inputEl = document.getElementById("intervalo-input");
      inputEl.value = Math.round(intervaloMs / 1000);

      document.getElementById("btn-set-intervalo").addEventListener("click", async () => {
  const s = Number(inputEl.value);
  if (!Number.isFinite(s) || s < 1) {
    alert("Insira um número válido (segundos).");
    return;
  }

  intervaloMs = Math.round(s * 1000);
  console.log("⏱ Intervalo atualizado localmente para (ms):", intervaloMs);

  // --- Envia para o Django ---
  try {
    const resp = await fetch("/salvar_intervalo/", {
      method: "POST",
      headers: {
        "X-CSRFToken": getCookie("csrftoken"),
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: new URLSearchParams({ segundos: s }),
    });

    const data = await resp.json();
    if (resp.ok) {
      alert("✅ Intervalo salvo com sucesso!");
    } else {
      alert("❌ Erro ao salvar: " + (data.erro || "erro desconhecido"));
    }
  } catch (e) {
    console.error("Erro ao enviar intervalo:", e);
    alert("Erro ao conectar com o servidor.");
  }
});

    // função auxiliar para pegar o CSRF token do cookie
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

      // inicializa câmera
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          statusEl.innerText = "Câmera ativada com sucesso!";
          statusEl.style.color = "#0f0";

          // start quando metadados prontos
          video.addEventListener("loadedmetadata", () => {
            console.log("🎥 Vídeo pronto, iniciando loop de captura...");
            startLoop(); // start separado para poder reiniciar depois
          });
        })
        .catch(err => {
          console.error("Erro ao acessar a câmera:", err);
          statusEl.innerText = "Erro ao acessar a câmera.";
          statusEl.style.color = "#f00";
        });

      function mostrarSentimento(sentimento) {
        overlay.style.display = "block";
        overlay.innerText = "Sentimento detectado: " + sentimento;
      }

      async function capturarFrame() {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        return new Promise(resolve => canvas.toBlob(blob => resolve(blob), "image/jpeg"));
      }

      async function enviarFrame() {
        try {
          console.log("📸 Capturando frame...");
          const frameBlob = await capturarFrame();
          const formData = new FormData();
          formData.append("frame", frameBlob, "frame.jpg");

          console.log("📤 Enviando frame para o backend...");
          const resp = await fetch("/process_frame/", { method: "POST", body: formData });
          if (!resp.ok) {
            console.warn("Resposta não OK do backend:", resp.status);
            // tenta ler JSON para ver erro
            try { const j = await resp.json(); console.warn(j); } catch(_) {}
            return null;
          }
          const data = await resp.json();
          console.log("✅ Resposta recebida do backend:", data);
          return data;
        } catch (err) {
          console.error("❌ Erro ao enviar frame:", err);
          return null;
        }
      }

      // Controle para evitar múltiplos loops simultâneos
      let loopRunning = false;
      function startLoop() {
        if (loopRunning) {
          console.log("Loop já está rodando — não inicia outro.");
          return;
        }
        loopRunning = true;
        (async function loop() {
          while (loopRunning) {
            const result = await enviarFrame();
            if (result && result.detected) {
              mostrarSentimento(result.sentiment);
            } else if (result && result.detected === false) {
              overlay.style.display = "block";
              overlay.innerText = "Nenhuma pessoa detectada";
            }
            console.log(`⏳ Aguardando ${intervaloMs/1000} s até próxima captura...`);
            await new Promise(r => setTimeout(r, intervaloMs));
          }
        })();
      }

      // Botão opcional para parar/reiniciar (útil para debug)
      const btnStop = document.createElement("button");
      btnStop.textContent = "Parar captura";
      btnStop.style.marginLeft = "12px";
      btnStop.onclick = () => {
        loopRunning = !loopRunning;
        if (loopRunning) {
          btnStop.textContent = "Parar captura";
          startLoop();
        } else {
          btnStop.textContent = "Iniciar captura";
        }
      };
      document.getElementById("controls").appendChild(btnStop);

      // expõe função para debug no console se quiser
      window.__camera_debug = { getInterval: () => intervaloMs, setIntervalMs: v => { intervaloMs=v; } };

    })();
  </script>
</body>
</html>
